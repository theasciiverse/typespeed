# System packages (.deb, .rpm, .apk, Arch) for typespeed, built by nfpm from
# the same static Linux build as the av archive. The release workflow sets
# VERSION, RELEASE (our packaging release) and ARCH (amd64 or arm64).
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
#
# Installed without setgid games, so there is no shared high score file:
# each player's scores go to ~/.typespeed/score (see PATCHES.md).
name: typespeed
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/typespeed
license: GPL-2.0-or-later
description: |
  Type the words before they fly off the screen.
  A typing game for the terminal with word lists in several languages,
  Unix commands and programming keywords, and two-player network games.
  Typespeed 0.6.5 by Jani Ollikainen and others, with Debian's patches,
  packaged by Asciiverse.
contents:
  - src: src/typespeed
    dst: /usr/bin/typespeed
    file_info: { mode: 0755 }
  - src: words/words.*
    dst: /usr/share/typespeed/words/
    file_info: { mode: 0644 }
  - src: rules/rule.*
    dst: /usr/share/typespeed/rules/
    file_info: { mode: 0644 }
  - src: etc/typespeedrc
    dst: /etc/typespeedrc
    type: config|noreplace
    file_info: { mode: 0644 }
  - src: COPYING
    dst: /usr/share/doc/typespeed/copyright
    file_info: { mode: 0644 }
  - src: README
    dst: /usr/share/doc/typespeed/README
    file_info: { mode: 0644 }
